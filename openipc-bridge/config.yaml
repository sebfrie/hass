name: "OpenIPC Bridge"
version: "1.4.0"
slug: openipc_bridge
description: "OpenIPC Bridge with built-in TTS generators, OSD editor, and video streaming"
url: "https://github.com/sebfrie/hass"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
host_network: true
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: "API and Web UI port"
webui: "http://[HOST]:[PORT:5000]/"
panel_icon: "mdi:camera-wireless"  # Sidebar icon
panel_title: "OpenIPC Bridge"      # Sidebar title
panel_admin: false                  # Available to all users
init: false
hassio_api: true
hassio_role: default
homeassistant_api: true
map:
  - config:rw
  - media:rw
options:
  # Password for access to the API/Web UI from outside the add-on host
  # (Basic auth, any username, or "Authorization: Bearer <password>").
  # Requests from the HA host itself (localhost) need no password.
  # While empty, all remote requests are rejected.
  access_password: ""
  telegram_bot_token: ""
  telegram_chat_id: ""
schema:
  access_password: password
  telegram_bot_token: str
  telegram_chat_id: str