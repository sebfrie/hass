name: "OpenIPC Bridge"
version: "1.3.7"
slug: openipc_bridge
description: "OpenIPC Bridge with built-in TTS generators, OSD editor, and video streaming"
url: "https://github.com/sebfrie/hass"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
host_network: true
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: "API and Web UI port"
webui: "http://[HOST]:[PORT:5000]/"
panel_icon: "mdi:camera-wireless"  # Иконка для боковой панели
panel_title: "OpenIPC Bridge"      # Название в боковой панели
panel_admin: false                  # Доступно всем пользователям
init: false
hassio_api: true
hassio_role: default
homeassistant_api: true
map:
  - config:rw
options:
  telegram_bot_token: ""
  telegram_chat_id: ""
schema:
  telegram_bot_token: str
  telegram_chat_id: str