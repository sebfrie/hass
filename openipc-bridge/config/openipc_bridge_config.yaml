# OpenIPC Bridge Configuration - created automatically on first run

# Camera settings
cameras:
  - name: "OpenIPC SIP"           # Camera name
    ip: "192.168.1.4"              # IP address
    type: "openipc"                # Type: openipc, beward, vivotek
    username: "root"                # Username
    password: "CHANGE_ME"           # Password
    snapshot_endpoints:             # Endpoints for fetching snapshots
      - "/image.jpg"
      - "/cgi-bin/api.cgi?cmd=Snap&channel=0"
    tts_endpoint: "/play_audio"     # TTS endpoint
    tts_format: "pcm"               # Format: pcm (OpenIPC), alaw (Beward)
    relay_endpoints:                 # Relay endpoints (if any)
      relay1_on: "/cgi-bin/relay.cgi?relay=1&state=1"
      relay1_off: "/cgi-bin/relay.cgi?relay=1&state=0"
      relay2_on: "/cgi-bin/relay.cgi?relay=2&state=1"
      relay2_off: "/cgi-bin/relay.cgi?relay=2&state=0"

  - name: "Beward Doorbell"
    ip: "192.168.1.10"
    type: "beward"
    username: "admin"
    password: "CHANGE_ME"
    snapshot_endpoints:
      - "/cgi-bin/jpg/image.cgi"
      - "/cgi-bin/snapshot.cgi"
    tts_endpoint: "/cgi-bin/audio/transmit.cgi"
    tts_format: "alaw"
    relay_endpoints:
      relay1_on: "/cgi-bin/intercom_cgi?action=maindoor"
      relay1_off: "/cgi-bin/intercom_cgi?action=maindoor&close=1"
      relay2_on: "/cgi-bin/intercom_cgi?action=altdoor"
      relay2_off: "/cgi-bin/intercom_cgi?action=altdoor&close=1"

# TTS settings
tts:
  provider: "google"                 # google, rhvoice
  google:
    language: "ru"                   # ru, en, etc
    slow: false                      # slow speech
  rhvoice:
    voice: "anna"                    # Voice
    language: "ru"                   
    speed: 1.0                       # Speed 0.5-2.0

# Logging settings
logging:
  level: "INFO"                      # DEBUG, INFO, WARNING, ERROR
  debug_qr: true                     # Save debug snapshots
  max_debug_images: 100               # Maximum debug snapshots